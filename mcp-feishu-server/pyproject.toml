[project]
name = "mcp-feishu-server"
version = "0.1.0"
description = "Minimal Feishu Mail and Calendar MCP server for the local assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp[cli]>=1.10.1,<2",
    # The host already uses the same official SDK for the Feishu bot. Pinning
    # the lower bound here keeps the MCP subprocess independently installable.
    "lark-oapi>=1.7.5",
    "httpx>=0.27",
    "python-dotenv>=1.1.0",
]

[project.scripts]
mcp-feishu-server = "mcp_feishu_server.server:main"
mcp-feishu-auth = "mcp_feishu_server.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_feishu_server"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
