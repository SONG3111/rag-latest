[project]
name = "mcp-google-server"
version = "0.1.0"
description = "Minimal Gmail and Google Calendar MCP server for the local assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Keep the same MCP major as the host application and the office server.
    "mcp[cli]>=1.10.1,<2",
    "google-api-python-client>=2.168.0",
    "google-auth-oauthlib>=1.2.2",
]

[project.scripts]
mcp-google-server = "mcp_google_server.server:main"
mcp-google-auth = "mcp_google_server.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_google_server"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
