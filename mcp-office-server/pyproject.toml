[project]
name = "mcp-office-server"
version = "0.1.0"
description = "Unified MCP server for Excel/Word document operations inside a workspace sandbox"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # <2: the code targets the mcp 1.x API (mcp.server.fastmcp.FastMCP);
    # 2.x renamed the module and breaks the import at startup.
    "mcp[cli]>=1.10.1,<2",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    # Workbook-mode formula evaluation for the calculate tool (GPL-3.0,
    # consumed unmodified — see NOTICE.md).
    "pycel>=1.0b30",
]

[project.scripts]
mcp-office-server = "mcp_office_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_office_server"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
