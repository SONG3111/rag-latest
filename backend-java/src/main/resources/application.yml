spring:
  application:
    name: rag-backend
  jackson:
    # 对外契约沿袭 Python 版的 snake_case（file_count/rel_path/created_at...）。
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:sqlite:${rag.data-dir}/app.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 对齐 Python 版连接 pragma：WAL + busy_timeout=30s + 外键级联。
      # 经 Hikari 的 driver-properties 传给 sqlite-jdbc，每条连接生效。
      maximum-pool-size: 4
      data-source-properties:
        journal_mode: "WAL"
        busy_timeout: "30000"
        foreign_keys: "true"

server:
  port: 8000

rag:
  # 本地开发从仓库根目录启动（README 命令），与 Python 版默认的 ./data 对齐；
  # Docker 里由 compose 注入 DATA_DIR=/app/data。
  data-dir: ${DATA_DIR:./data}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    request-timeout: 30s
    # 与 ai-service 的 CHAT_TURN_TIMEOUT 对齐（原 Python 版 300s）。
    chat-turn-timeout: ${CHAT_TURN_TIMEOUT:300s}

logging:
  level:
    com.raglatest: INFO
