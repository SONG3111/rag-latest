# 注意：classpath 上同名 application.yml 只加载优先级最高的一个——本文件位于
# test-classes，会【整体遮蔽】main/resources/application.yml 而非合并。
# 因此这里是 main yml 的全文拷贝 + 底部三项测试覆盖；改动 main yml 时须同步此处。
#
# 【多用户改造后的主要变化】
#   * 数据源改为 Postgres，URL/账号由每个测试类的 @DynamicPropertySource 注入
#     （EmbeddedPostgresSupport，每类一个库）；
#   * 测试里不使用 .env（main yml 的 config.import 在此被整体遮蔽），
#     INTERNAL_TOKEN 与引导管理员都取固定值；
#   * 引导管理员密码固定，测试直接以它登录（幂等：库空才建号）。
spring:
  application:
    name: rag-backend
  jackson:
    # 对外契约沿袭 Python 版的 snake_case（file_count/rel_path/created_at...）。
    property-naming-strategy: SNAKE_CASE
  datasource:
    # 占位值：真正的 URL 由 EmbeddedPostgresSupport.register(...) 每个测试类注入。
    url: jdbc:postgresql://127.0.0.1:5432/unset
    username: postgres
    password: ""
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
  # 索引任务队列：上传/写后重建全部经 RabbitMQ 持久化（拓扑声明见 AmqpConfig）。
  # 消费失败不 requeue（毒消息/未预期异常进 DLQ 观测，业务失败由文件状态机
  # failed + reindex 端点恢复）；并发 1 对齐原单线程 reindex executor。
  # 【测试覆盖】dynamic=false 不向 broker 声明拓扑、listener 不启动：不连 5672，
  # ReindexProducer 一律 @MockitoBean 替换（默认套件全 mock、零 Docker 依赖）。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    dynamic: false
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        auto-startup: false
        default-requeue-rejected: false
  # 读路径缓存（tools/preview/health/retrieval-corpus）。
  # 【测试覆盖】simple（进程内 ConcurrentMap）：@Cacheable/@CacheEvict 的命中与
  # 失效语义照常验证，只是不经过 Redis；需要真 Redis/RabbitMQ 的用例见 *IT
  # （failsafe，不进 mvnw test；ResilienceTests 类内另行覆盖为 none）。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: simple

server:
  port: 8000
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        name: RAG_SESSION
        http-only: true
        same-site: lax
        # 测试走 http://127.0.0.1:随机端口，Secure Cookie 会被浏览器/客户端丢掉。
        secure: false

rag:
  # 本地开发从仓库根目录启动（README 命令），与 Python 版默认的 ./data 对齐；
  # 测试里由各测试类的 @DynamicPropertySource 指向临时目录。
  data-dir: ${DATA_DIR:./data}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    request-timeout: 30s
    # 与 ai-service 的 CHAT_TURN_TIMEOUT 对齐（原 Python 版 300s）。
    chat-turn-timeout: ${CHAT_TURN_TIMEOUT:300s}
  # 固定值：测试不读 .env，两侧（Java/WireMock）用同一个常量。
  internal-token: test-internal-token
  security:
    bootstrap-admin-email: admin@test.local
    bootstrap-admin-password: test-admin-password
  # 韧性容错：Java→ai-service 边界的熔断与聊天回合舱壁。
  # 重试/并发限制走 Spring Framework 7 原生注解（@Retryable/@ConcurrencyLimit），不在此配置。
  resilience:
    # 读路径熔断；聊天回合用专用配置（关闭慢调用判定），见 ResilienceConfig。
    circuit-breaker:
      failure-rate-threshold: ${RAG_CB_FAILURE_RATE:50}
      sliding-window-size: ${RAG_CB_WINDOW:20}
      # 口径是“尝试数”（重试在熔断内层）：读接口一次逻辑调用最多 1+2 次，
      # 5 约合 2 次逻辑失败即开闸（有意的快速保护）。
      minimum-number-of-calls: ${RAG_CB_MIN_CALLS:5}
      wait-duration-in-open-state: ${RAG_CB_OPEN_WAIT:15s}
      permitted-number-of-calls-in-half-open-state: ${RAG_CB_HALF_OPEN_CALLS:3}
      slow-call-duration-threshold: ${RAG_CB_SLOW_CALL:10s}
      slow-call-rate-threshold: ${RAG_CB_SLOW_RATE:80}
    bulkhead:
      chat-max-concurrent-calls: ${RAG_BULKHEAD_CHAT_MAX:4}
      chat-max-wait-duration: ${RAG_BULKHEAD_CHAT_WAIT:0s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.raglatest: INFO

