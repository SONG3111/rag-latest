map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns every non-API route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # SSE must not be buffered, or the conversation appears to freeze until
        # the whole turn finishes.
        proxy_buffering off;
        proxy_cache off;
        # SSE sends no Upgrade header (map resolves to "close"); meeting audio
        # sends Upgrade: websocket and resolves to "upgrade".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
