server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns every non-API route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # SSE must not be buffered, or the conversation appears to freeze until
        # the whole turn finishes.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端开了 forward-headers-strategy=framework：这两个头决定
        # 「请求是不是 HTTPS」（Secure Cookie 判定）与审计日志里的客户端地址。
        # 缺了它们，HTTPS 部署下会话 Cookie 可能不带 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
