services:
  # Java 业务后端：唯一对外（8000）的服务，前端 nginx/vite 都指向它。
  # 服务名保持 backend，frontend/nginx.conf 的 proxy_pass http://backend:8000 不变。
  backend:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      AI_SERVICE_URL: http://ai-service:8001
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      ai-service:
        condition: service_started
      # 索引任务队列与读缓存是启动强依赖：队列/缓存未就绪前不拉起后端。
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Python AI 服务：agent/检索/嵌入 + MCP 子进程，仅内网 8001。
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      # Workspaces, backups, and the vector index all live here.
      - ./data:/app/data
      # Local embedding / reranking weights, mounted read-only. The paths in .env
      # must be the in-container paths (/models/bge-m3, /models/bge-reranker-v2-m3)
      # when running under Docker; set EMBEDDING_PROVIDER=dashscope to skip this.
      - ${LOCAL_MODELS_DIR:-C:/code/agent/rag/models}:/models:ro
    expose:
      - "8001"
    restart: unless-stopped

  # 索引任务队列（持久化）：上传/写后重建全异步化，backend 是唯一生产/消费者。
  # 官方镜像刻意不带默认 HEALTHCHECK，标准做法是 rabbitmq-diagnostics ping
  #（见 docker-library/docs/rabbitmq README 与 RabbitMQ monitoring 文档）。
  # 队列与消息均持久化，volume 必须挂——broker 磁盘丢了任务才真的丢。
  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # 管理界面仅本机访问（观测队列堆积/死信）。
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 读路径缓存（tools/preview/health/retrieval-corpus）：appendonly 落盘，
  # healthcheck 用 redis-cli ping（社区标准写法，官方镜像不带 HEALTHCHECK）。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  rabbitmq-data:
  redis-data:
